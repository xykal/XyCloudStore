name: Build XyCloud Agent (Windows)

on:
  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-windows:
    name: Build Agen Windows (xycloud-agent.exe)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Konfigurasi CMake (MSVC x64)
        shell: pwsh
        run: cmake -S agent-cpp -B build-agent -DCMAKE_BUILD_TYPE=Release

      - name: Bangun rilis native (C++ Win32+DX11+ImGui)
        shell: pwsh
        run: |
          cmake --build build-agent --config Release
          $exe = Get-Item "build-agent/Release/xycloud-agent.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "xycloud-agent.exe tidak ditemukan setelah cmake build" }
          Write-Host "EXE:" $exe.FullName $exe.Length

      - name: Smoke-test versi
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\build-agent\Release\xycloud-agent.exe -ArgumentList '--veri' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput veri.txt
          Get-Content veri.txt
          if ($p.ExitCode -ne 0) { throw "Smoke-test --veri gagal (exit $($p.ExitCode))" }
          if (-not (Select-String -Path veri.txt -Pattern 'XyCloudStore Agen 1\.6\.0-cpp' -Quiet)) {
            throw "Output --veri tidak memuat versi yang diharapkan"
          }
          Remove-Item veri.txt -Force -ErrorAction SilentlyContinue

      - name: Unggah artifact xycloud-agent.exe
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: xycloud-agent-windows
          path: build-agent/Release/xycloud-agent.exe
          if-no-files-found: error
